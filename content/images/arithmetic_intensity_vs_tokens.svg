    <marker id="arr2" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#888780"/>
    </marker>
  <mask id="imagine-text-gaps-u0lwnv" maskUnits="userSpaceOnUse"><rect x="0" y="0" width="680" height="380" fill="white"/><rect x="296.2612609863281" y="323.6864929199219" width="107.47749328613281" height="24.606531143188477" fill="black" rx="2"/><rect x="-53.71826934814453" y="156.68649291992188" width="159.43653869628906" height="24.606531143188477" fill="black" rx="2"/><rect x="612" y="93.26231384277344" width="35.274139404296875" height="21.172109603881836" fill="black" rx="2"/><rect x="218" y="34.26231002807617" width="141.8753662109375" height="21.172109603881836" fill="black" rx="2"/><rect x="395.9999694824219" y="40.26231002807617" width="103.96257781982422" height="21.172109603881836" fill="black" rx="2"/><rect x="91" y="204.26229858398438" width="55.98799514770508" height="21.172109603881836" fill="black" rx="2"/><rect x="150.4995574951172" y="303.12091064453125" width="19.000882148742676" height="20.31350326538086" fill="black" rx="2"/><rect x="490.49957275390625" y="303.12091064453125" width="19.000882148742676" height="20.31350326538086" fill="black" rx="2"/><rect x="64.94121551513672" y="301.12091064453125" width="14.117563724517822" height="20.31350326538086" fill="black" rx="2"/></mask></defs>

  <!-- axes -->
  <line x1="80" y1="300" x2="620" y2="300" stroke="#888780" stroke-width="1.2" marker-end="url(#arr)" style="fill:rgb(0, 0, 0);stroke:rgb(136, 135, 128);color:rgb(0, 0, 0);stroke-width:1.2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="80" y1="300" x2="80" y2="40" stroke="#888780" stroke-width="1.2" marker-end="url(#arr2)" mask="url(#imagine-text-gaps-u0lwnv)" style="fill:rgb(0, 0, 0);stroke:rgb(136, 135, 128);color:rgb(0, 0, 0);stroke-width:1.2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- axis labels -->
  <text x="350" y="342" text-anchor="middle" font-size="14" fill="#5F5E5A" style="fill:rgb(95, 94, 90);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, sans-serif;font-size:14px;font-weight:400;text-anchor:middle;dominant-baseline:auto">输入 token 数量</text>
  <text x="26" y="175" text-anchor="middle" font-size="14" fill="#5F5E5A" transform="rotate(-90,26,175)" style="fill:rgb(95, 94, 90);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, sans-serif;font-size:14px;font-weight:400;text-anchor:middle;dominant-baseline:auto">计算强度（FLOP/Byte）</text>

  <!-- peak FLOPS horizontal dashed line -->
  <line x1="80" y1="105" x2="610" y2="105" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5,4" style="fill:rgb(0, 0, 0);stroke:rgb(180, 178, 169);color:rgb(0, 0, 0);stroke-width:1px;stroke-dasharray:5px, 4px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="616" y="109" font-size="12" fill="#888780" style="fill:rgb(136, 135, 128);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:auto">peak</text>

  <!-- curve: rises, peaks, slowly falls -->
  <!-- points: (80,280) start low, rises to peak ~(220,105), then slowly descends to (600,155) -->
  <path d="M80,280 C120,260 160,140 220,105 C290,75 330,100 380,112 C460,128 530,138 600,150" fill="none" stroke="#534AB7" stroke-width="2.5" stroke-linejoin="round" mask="url(#imagine-text-gaps-u0lwnv)" style="fill:none;stroke:rgb(83, 74, 183);color:rgb(0, 0, 0);stroke-width:2.5px;stroke-linecap:butt;stroke-linejoin:round;opacity:1;font-family:&quot;Anthropic Sans&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- peak dot -->
  <circle cx="220" cy="105" r="5" fill="#534AB7" style="fill:rgb(83, 74, 183);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- annotation: peak -->
  <line x1="220" y1="100" x2="220" y2="55" stroke="#AFA9EC" stroke-width="1" stroke-dasharray="4,3" style="fill:rgb(0, 0, 0);stroke:rgb(175, 169, 236);color:rgb(0, 0, 0);stroke-width:1px;stroke-dasharray:4px, 3px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="222" y="50" font-size="12" fill="#534AB7" style="fill:rgb(83, 74, 183);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:auto">达到 peak FLOP/s 利用率</text>

  <!-- annotation: slow decline -->
  <line x1="490" y1="143" x2="490" y2="60" stroke="#AFA9EC" stroke-width="1" stroke-dasharray="4,3" mask="url(#imagine-text-gaps-u0lwnv)" style="fill:rgb(0, 0, 0);stroke:rgb(175, 169, 236);color:rgb(0, 0, 0);stroke-width:1px;stroke-dasharray:4px, 3px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="400" y="56" font-size="12" fill="#534AB7" style="fill:rgb(83, 74, 183);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:auto">计算强度缓慢下降</text>

  <!-- annotation: rising phase -->
  <text x="95" y="220" font-size="12" fill="#7F77DD" style="fill:rgb(127, 119, 221);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:auto">快速上升</text>
  <line x1="140" y1="210" x2="165" y2="175" stroke="#AFA9EC" stroke-width="1" marker-end="url(#arr)" mask="url(#imagine-text-gaps-u0lwnv)" style="fill:rgb(0, 0, 0);stroke:rgb(175, 169, 236);color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- x-axis tick: small token -->
  <line x1="160" y1="296" x2="160" y2="304" stroke="#888780" stroke-width="1" style="fill:rgb(0, 0, 0);stroke:rgb(136, 135, 128);color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="160" y="318" text-anchor="middle" font-size="11" fill="#888780" style="fill:rgb(136, 135, 128);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, sans-serif;font-size:11px;font-weight:400;text-anchor:middle;dominant-baseline:auto">少</text>

  <!-- x-axis tick: large token -->
  <line x1="500" y1="296" x2="500" y2="304" stroke="#888780" stroke-width="1" style="fill:rgb(0, 0, 0);stroke:rgb(136, 135, 128);color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="500" y="318" text-anchor="middle" font-size="11" fill="#888780" style="fill:rgb(136, 135, 128);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, sans-serif;font-size:11px;font-weight:400;text-anchor:middle;dominant-baseline:auto">多</text>

  <!-- origin label -->
  <text x="72" y="316" text-anchor="middle" font-size="11" fill="#888780" style="fill:rgb(136, 135, 128);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, sans-serif;font-size:11px;font-weight:400;text-anchor:middle;dominant-baseline:auto">0</text>
</svg>